<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stack | Ángel García</title>

    <link
        rel="stylesheet"
        href="../styles.css"
    >

</head>

<body>

    <div id="navbar"></div>


    <main>

        <section class="page-header">

            <div class="container">

                <span class="section-number">
                    01
                </span>

                <h1>
                    Stack tecnológico
                </h1>

                <p>
                    Tecnologías, lenguajes, frameworks,
                    herramientas y conocimientos técnicos.
                </p>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div
                    id="skills-container"
                    class="skills-grid"
                >
                    <!-- JavaScript -->
                </div>

            </div>

        </section>

    </main>


    <footer>

        <div class="container footer-content">

            <p>
                ©
                <span id="year"></span>
                Ángel García
            </p>

            <p>
                Portfolio técnico
            </p>

        </div>

    </footer>


    <script src="../js/navbar.js"></script>

    <script>

        async function cargarSkills() {

            const response =
                await fetch("../data/skills.json");

            const skills =
                await response.json();


            const container =
                document.querySelector(
                    "#skills-container"
                );


            skills.forEach(skill => {

                const card =
                    document.createElement("article");


                card.className =
                    "skill-card";


                card.innerHTML = `

                    <span class="skill-category">
                        ${skill.category}
                    </span>

                    <h3>
                        ${skill.name}
                    </h3>

                    <span class="skill-level">
                        ${skill.level}
                    </span>

                `;


                container.appendChild(card);

            });

        }


        cargarSkills();


        document.querySelector("#year")
            .textContent =
            new Date().getFullYear();

    </script>

</body>

</html>
