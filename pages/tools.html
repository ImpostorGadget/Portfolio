<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tools de Impostor Gadget.">
    <title>Tools · Impostor Gadget</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="terminal-wrapper">

        <div class="terminal-bar">
            <div class="terminal-dots">
                <span class="dot-red"></span>
                <span class="dot-yellow"></span>
                <span class="dot-green"></span>
            </div>
            <div class="terminal-path">root@angel:~/tools</div>
            <div class="terminal-status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>
        </div>

        <div class="terminal-body">

            <header class="terminal-header">
                <h1 class="terminal-logo">
                    Impostor Gadget<span class="terminal-logo-cursor">▌</span>
                </h1>

                <nav class="terminal-nav">
                    <a href="/">~/home</a>
                    <a href="/pages/stack.html">~/stack</a>
                    <a href="/pages/proyectos.html">~/proyectos</a>
                    <a href="/pages/tools.html" class="active">~/tools</a>
                    <a href="/cheatsheets/index.html">~/cheatsheets</a>
                    <a href="/writeups/writeups.html">~/writeups</a>
                    <a href="/pages/sobre-mi.html">~/sobre-mi</a>
                </nav>

                <div class="terminal-subnav">
                    <div class="terminal-lang">
                        <span class="active">ES</span> · <span>EN</span>
                    </div>
                    <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="terminal-account">
                        Github
                    </a>
                </div>
            </header>

            <div class="terminal-command">
                <span class="prompt">root@angel</span><span class="sep">:</span><span class="path">~/tools</span><span class="sep">$</span> <span class="cmd">ls tools/</span>
            </div>

            <h1>Tools</h1>
            <p class="term-muted">Herramientas y utilidades en desarrollo.</p>

        </div>

        <div class="term-footer">
            <span>© <span id="current-year"></span> Impostor Gadget</span>
            <span>Portfolio técnico</span>
        </div>

    </div>

    <script>
        document.querySelector("#current-year").textContent = new Date().getFullYear();
    </script>

</body>

</html>
