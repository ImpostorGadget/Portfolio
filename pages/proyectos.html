<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proyectos | Ángel García</title>

    <link
        rel="stylesheet"
        href="../styles.css"
    >

</head>

<body>

    <div id="navbar"></div>


    <main>

        <section class="page-header">

            <div class="container">

                <span class="section-number">
                    02
                </span>

                <h1>
                    Proyectos
                </h1>

                <p>
                    Proyectos personales, académicos y
                    experimentales.
                </p>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div
                    id="projects-container"
                    class="projects-grid"
                >
                    <!-- JavaScript -->
                </div>

            </div>

        </section>

    </main>


    <footer>

        <div class="container footer-content">

            <p>
                ©
                <span id="year"></span>
                Ángel García
            </p>

            <p>
                Portfolio técnico
            </p>

        </div>

    </footer>


    <script src="../js/navbar.js"></script>


    <script>

        async function cargarProyectos() {

            const response =
                await fetch("../data/projects.json");

            const projects =
                await response.json();


            const container =
                document.querySelector(
                    "#projects-container"
                );


            projects.forEach(project => {

                const card =
                    document.createElement("article");


                card.className =
                    "project-card";


                card.innerHTML = `

                    <h3>
                        ${project.title}
                    </h3>

                    <p>
                        ${project.description}
                    </p>

                    <div class="project-tech">

                        ${project.technologies
                            .map(
                                tech =>
                                `<span class="tech">${tech}</span>`
                            )
                            .join("")}

                    </div>

                    <span class="skill-level">
                        ${project.status}
                    </span>

                `;


                container.appendChild(card);

            });

        }


        cargarProyectos();


        document.querySelector("#year")
            .textContent =
            new Date().getFullYear();

    </script>

</body>

</html>
