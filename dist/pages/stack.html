<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stack tecnológico de Impostor Gadget.">
    <title>Stack · Impostor Gadget</title>

  <script type="module" crossorigin src="/assets/stack-rUewz691.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="stylesheet" crossorigin href="/assets/stack-DWbUZt9C.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-CF6PF51b.css">
</head>

<body>

    <div class="terminal-wrapper">

        <!-- Barra superior -->

        <div class="terminal-bar">
            <div class="terminal-dots">
                <span class="dot-red"></span>
                <span class="dot-yellow"></span>
                <span class="dot-green"></span>
            </div>
            <div class="terminal-path">root@angel:~/stack</div>
            <div class="terminal-status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>
        </div>


        <div class="terminal-body">

            <!-- Header -->

            <header class="terminal-header">
                <h1 class="terminal-logo">
                    Impostor Gadget<span class="terminal-logo-cursor">▌</span>
                </h1>

                <nav class="terminal-nav">
                    <a href="/">~/home</a>
                    <a href="/pages/stack.html" class="active">~/stack</a>
                    <a href="/pages/proyectos.html">~/proyectos</a>
                    <a href="/pages/tools.html">~/tools</a>
                    <a href="/cheatsheets/index.html">~/cheatsheets</a>
                    <a href="/writeups/writeups.html">~/writeups</a>
                    <a href="/pages/sobre-mi.html">~/sobre-mi</a>
                </nav>

                <div class="terminal-subnav">
                    <div class="terminal-lang">
                        <span class="active">ES</span> · <span>EN</span>
                    </div>
                    <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="terminal-account">
                        Github
                    </a>
                </div>
            </header>


            <!-- Comando -->

            <div class="terminal-command">
                <span class="prompt">root@angel</span><span class="sep">:</span><span class="path">~/stack</span><span class="sep">$</span> <span class="cmd">cat stack.log</span>
            </div>


            <!-- Contenido -->

            <section class="stack-section">
                <div id="stack-container" class="stack-content">
                    <p class="loading">Cargando stack...</p>
                </div>
            </section>

        </div>


        <!-- Footer -->

        <div class="term-footer">
            <span>© <span id="current-year"></span> Impostor Gadget</span>
            <span>Portfolio técnico</span>
        </div>

    </div>


    <script>
        document.querySelector("#current-year").textContent =
            new Date().getFullYear();
    </script>

</body>

</html>
